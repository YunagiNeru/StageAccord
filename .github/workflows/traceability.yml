name: Traceability

on:
  pull_request:
    paths:
      - "docs/**"
      - "scripts/verify_traceability.py"
      - "scripts/test_verify_traceability.py"
      - "scripts/generate_test_manifest.py"
      - "scripts/test_generate_test_manifest.py"
      - "contracts/test-manifest.json"
      - "contracts/openapi.json"
      - "scripts/generate_openapi.py"
      - "scripts/test_generate_openapi.py"
      - ".github/workflows/traceability.yml"
      - "package.json"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/verify_traceability.py"
      - "scripts/test_verify_traceability.py"
      - "scripts/generate_test_manifest.py"
      - "scripts/test_generate_test_manifest.py"
      - "contracts/test-manifest.json"
      - "contracts/openapi.json"
      - "scripts/generate_openapi.py"
      - "scripts/test_generate_openapi.py"
      - ".github/workflows/traceability.yml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  traceability:
    name: traceability
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Run failure fixtures
        run: python -m unittest scripts/test_verify_traceability.py
      - name: Verify document traceability
        run: python scripts/verify_traceability.py
      - name: Run test manifest fixture
        run: python -m unittest scripts/test_generate_test_manifest.py
      - name: Verify test manifest
        run: python scripts/generate_test_manifest.py --check
      - name: Run OpenAPI fixture
        run: python -m unittest scripts/test_generate_openapi.py
      - name: Verify OpenAPI contract
        run: python scripts/generate_openapi.py --check
