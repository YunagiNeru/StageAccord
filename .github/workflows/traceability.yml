name: Traceability

on:
  pull_request:
    paths:
      - "docs/**"
      - "scripts/verify_traceability.py"
      - "scripts/test_verify_traceability.py"
      - ".github/workflows/traceability.yml"
      - "package.json"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/verify_traceability.py"
      - "scripts/test_verify_traceability.py"
      - ".github/workflows/traceability.yml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  traceability:
    name: traceability
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Run failure fixtures
        run: python -m unittest scripts/test_verify_traceability.py
      - name: Verify document traceability
        run: python scripts/verify_traceability.py
