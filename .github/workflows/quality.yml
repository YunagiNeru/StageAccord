name: Quality

on:
  pull_request:
  push:
    branches: [main, "feature/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.1
        env:
          POSTGRES_DB: stageaccord_dummy_test
          POSTGRES_USER: stageaccord_test
          POSTGRES_PASSWORD: dummy_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stageaccord_test -d stageaccord_dummy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      STAGE_ACCORD_TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/stageaccord_dummy_test
      STAGE_ACCORD_TEST_DB_USERNAME: stageaccord_test
      STAGE_ACCORD_TEST_DB_PASSWORD: dummy_test_password
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: "10.29.1"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.17.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - run: pnpm verify
