# Stage AccordのSpring Boot設定はこのファイルだけで管理する
# 秘密値を含むためGit管理・Docker build context・JARへの同梱を禁止する
# 「要確認」「要入力」が残る値は、本番で使用できない

# =============================================================================
# 共通設定
# =============================================================================

# --- Spring Boot基本設定 ---
# アプリケーション識別、プロファイル、終了処理

# Spring Bootが識別するアプリケーション名。ログ・メトリクスの識別子にも使う
spring.application.name=stage-accord
# プロファイルが選択されなかった場合の既定プロファイル。誤環境起動を防ぐためnoneに固定する
spring.profiles.default=none
# JMX管理口の有効・無効。不要な管理面を開かないため無効にする
spring.jmx.enabled=false
# 起動時バナーの表示方法。運用ログのノイズを抑える
spring.main.banner-mode=off
# graceful shutdownで各停止段階を待つ上限時間
spring.lifecycle.timeout-per-shutdown-phase=30s

# --- 監視・ヘルスチェック ---
# 外部公開を必要最小限に制限する

# Actuatorエンドポイントの既定アクセス方針。明示許可していないエンドポイントを閉じる
management.endpoints.access.default=none
# Actuator全体で許可できる最大アクセス水準
management.endpoints.access.max-permitted=read-only
# Actuatorエンドポイントを公開するURLの基点
management.endpoints.web.base-path=/actuator
# HTTP経由で公開を許可するActuatorエンドポイント一覧
management.endpoints.web.exposure.include=health,prometheus
# healthエンドポイントのアクセス水準
management.endpoint.health.access=read-only
# liveness・readiness probe用health groupを有効にする
management.endpoint.health.probes.enabled=true
# health応答へ内部詳細を表示するか。依存情報の露出を防ぐ
management.endpoint.health.show-details=never

# --- HTTP・セッション ---
# プロキシ転送、通信上限、Cookieの安全性を定義する

# reverse proxyから渡されるForwarded系ヘッダーの解釈方式
server.forward-headers-strategy=native
# HTTPリクエストヘッダー全体に許可する最大サイズ
server.max-http-request-header-size=16KB
# HTTPサーバー停止時の接続終了方式
server.shutdown=graceful
# JavaScriptからセッションCookieを読めないようにする
server.servlet.session.cookie.http-only=true
# HTTPS通信時だけセッションCookieを送信する
server.servlet.session.cookie.secure=true
# cross-siteリクエスト時のセッションCookie送信制約
server.servlet.session.cookie.same-site=lax
# セッションCookieの名前。__Host-制約でdomain固定や不正上書きを防ぐ
server.servlet.session.cookie.name=__Host-stageaccord-session
# セッションCookieを送信するURLパス範囲
server.servlet.session.cookie.path=/
# セッション IDを保持する手段。URL埋込みを禁止してCookieだけを使う
server.servlet.session.tracking-modes=cookie

# --- ログ ---
# ログレベル、標準出力形式、機密情報のマスキング

# 標準出力ログの形式と、認証情報らしい値を置換するredaction規則
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%p application=${spring.application.name} logger=%logger{36} correlation_id=%X{correlationId:-none} message=%replace(%m){'(?i)(token|cookie|authorization|password|secret|signature)=[^ ]+','$1=[REDACTED]'}%n
# アプリケーション全体へ適用する既定ログレベル
logging.level.root=info

# --- PostgreSQL ---
# 接続先とGit管理外の実行資格情報

# PostgreSQL接続先URL。資格情報は含めず、username・passwordを別ファイルから読む
stage-accord.database.source-url=jdbc:postgresql://127.0.0.1:5432/stage_accord_dummy
# PostgreSQL runtime role名。秘密値のため、このファイルをGit・image・JARへ含めない
# 秘密値: 開発用は配置済み。本番用は担当管理者が別途発行して配置する
stage-accord.database.username=schema-user
# PostgreSQL runtime password。秘密値のため、このファイルをGit・image・JARへ含めない
# 秘密値: 開発用は配置済み。本番用は担当管理者が別途発行して配置する
stage-accord.database.password=schema-only-db-password-0001

# --- Valkey ---
# セッション、レート制限、キャッシュの接続先

# Valkey接続先URL。空の移植値はlocal実行には使わず、本番では未確定として拒否する
stage-accord.valkey.url=
# Valkey ACLユーザー名。認証を使わない開発環境では空にできる
stage-accord.valkey.username=schema-user
# Valkey ACLパスワード。認証を使わない開発環境では空にできる
