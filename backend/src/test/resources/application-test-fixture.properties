# メール送信プロバイダーの種類
stage-accord.mail.provider=ses
# 利用者へ表示する送信元メールアドレス
stage-accord.mail.from-address=noreply@example.invalid
# 利用者へ表示する送信者名
stage-accord.mail.from-name=StageAccord
# 利用者が返信した場合の宛先メールアドレス
stage-accord.mail.reply-to=reply@example.invalid
