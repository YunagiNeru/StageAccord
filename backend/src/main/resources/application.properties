# Stage Accord Spring Boot configuration. This is the only application configuration file.
# Secret values are never stored here; configtree imports purpose-specific local or mounted files.

spring.application.name=stage-accord
spring.profiles.default=none
spring.config.import=optional:configtree:/run/secrets/application/,optional:configtree:/run/secrets/worker/
spring.jmx.enabled=false
spring.main.banner-mode=off
spring.lifecycle.timeout-per-shutdown-phase=30s

management.endpoints.access.default=none
management.endpoints.access.max-permitted=read-only
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.access=read-only
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

server.forward-headers-strategy=native
server.max-http-request-header-size=16KB
server.shutdown=graceful
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.name=__Host-stageaccord-session
server.servlet.session.cookie.path=/
server.servlet.session.tracking-modes=cookie

logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%p application=${spring.application.name} logger=%logger{36} correlation_id=%X{correlationId:-none} message=%replace(%m){'(?i)(token|cookie|authorization|password|secret|signature)=[^ ]+','$1=[REDACTED]'}%n

