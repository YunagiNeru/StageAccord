spring.datasource.hikari.auto-commit=false
# 用途: DB connection poolから接続を得るまでの上限ミリ秒。
# 状態: local設計値。backend directoryを作業directoryとしてapp／worker実起動を確認済み。
spring.datasource.hikari.connection-timeout=5000
# 用途: DB connectionの生存確認を待つ上限ミリ秒。
# 状態: local設計値。backend directoryを作業directoryとしてapp／worker実起動を確認済み。
spring.datasource.hikari.validation-timeout=3000
# 用途: 起動時のDB connection確立に失敗した場合、起動を中止するまでの猶予ミリ秒。
# 状態: local設計値。backend directoryを作業directoryとしてapp／worker実起動を確認済み。
spring.datasource.hikari.initialization-fail-timeout=1
# 用途: DB connection poolが保持する最大connection数。
# 状態: local設計値。backend directoryを作業directoryとしてapp／worker実起動を確認済み。
spring.datasource.hikari.maximum-pool-size=10
# 用途: DB connection poolが維持する最小idle connection数。
# 状態: local設計値。backend directoryを作業directoryとしてapp／worker実起動を確認済み。
spring.datasource.hikari.minimum-idle=1
# 用途: Spring Data Redisへ渡すValkey互換接続URL。
# 状態: local設計値。backend directoryを作業directoryとしてapp／worker実起動を確認済み。
spring.data.redis.url=redis://127.0.0.1:6379
# 用途: 起動時にFlyway migrationを自動実行するか。権限分離のためruntimeでは無効にする。
# 状態: local設計値。backend directoryを作業directoryとしてapp／worker実起動を確認済み。
spring.flyway.enabled=false
# 用途: HTTP response生成までJPA sessionを保持するか。境界外queryを防ぐため無効にする。
# 状態: local設計値。backend directoryを作業directoryとしてapp／worker実起動を確認済み。
spring.jpa.open-in-view=false
# 用途: Hibernateによるschema操作方針。validateはschema変更せず整合だけを確認する。
# 状態: local設計値。backend directoryを作業directoryとしてapp／worker実起動を確認済み。
spring.jpa.hibernate.ddl-auto=validate
# 用途: JDBC timestampを読み書きする基準time zone。
# 状態: local設計値。backend directoryを作業directoryとしてapp／worker実起動を確認済み。
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

#---

spring.config.activate.on-profile=production
# 用途: この区画を有効にするprofile名。環境profileと実行ロールprofileを組み合わせる。
# 状態: 設計固定値。変更時はapp／workerとlocal／productionの排他guardも同時に見直す。

# 用途: RuntimeConfigurationGuardが検証する実行環境名。active profileと一致させる。
# 状態: production設計値。起動前検査を通過し、本番管理者が外部接続と秘密fileを実測確認した場合だけ使用する。
stage-accord.environment=production
# 用途: PostgreSQL runtime role名を格納するfile path。
# 状態: production専用path。実値は本番管理者が対象hostへ配置し、repositoryへ記録しない。
stage-accord.secrets.db-username-file=/run/secrets/application/db-username
# 用途: PostgreSQL runtime passwordを格納するfile path。
# 状態: production専用path。実値は本番管理者が対象hostへ配置し、repositoryへ記録しない。
stage-accord.secrets.db-password-file=/run/secrets/application/db-password
# 用途: Valkey ACL usernameを格納するfile path。
# 状態: production専用path。実値は本番管理者が対象hostへ配置し、repositoryへ記録しない。
stage-accord.secrets.valkey-username-file=/run/secrets/application/valkey-username
# 用途: Valkey ACL passwordを格納するfile path。
# 状態: production専用path。実値は本番管理者が対象hostへ配置し、repositoryへ記録しない。
stage-accord.secrets.valkey-password-file=/run/secrets/application/valkey-password
# 用途: application用S3 access key IDを格納するfile path。
# 状態: production専用path。実値は本番管理者が対象hostへ配置し、repositoryへ記録しない。
stage-accord.secrets.s3-access-key-id-file=/run/secrets/application/s3-application-access-key-id
# 用途: application用S3 secret access keyを格納するfile path。
# 状態: production専用path。実値は本番管理者が対象hostへ配置し、repositoryへ記録しない。
stage-accord.secrets.s3-secret-access-key-file=/run/secrets/application/s3-application-secret-access-key
# 用途: worker用S3 access key IDを格納するfile path。
# 状態: production専用path。実値は本番管理者が対象hostへ配置し、repositoryへ記録しない。
stage-accord.secrets.s3-worker-access-key-id-file=/run/secrets/worker/s3-worker-access-key-id
# 用途: worker用S3 secret access keyを格納するfile path。
# 状態: production専用path。実値は本番管理者が対象hostへ配置し、repositoryへ記録しない。
stage-accord.secrets.s3-worker-secret-access-key-file=/run/secrets/worker/s3-worker-secret-access-key
# 用途: Stripe秘密鍵を格納するfile path。
# 状態: production専用path。実値は本番管理者が対象hostへ配置し、repositoryへ記録しない。
stage-accord.secrets.stripe-api-key-file=/run/secrets/application/stripe-api-key
# 用途: Stripe webhook署名secretを格納するfile path。
# 状態: production専用path。実値は本番管理者が対象hostへ配置し、repositoryへ記録しない。
stage-accord.secrets.stripe-webhook-secret-file=/run/secrets/application/stripe-webhook-secret
# 用途: mail providerの送信credential IDを格納するfile path。
# 状態: production専用path。実値は本番管理者が対象hostへ配置し、repositoryへ記録しない。
stage-accord.secrets.mail-username-file=/run/secrets/worker/smtp-username
# 用途: mail providerの送信credential secretを格納するfile path。
# 状態: production専用path。実値は本番管理者が対象hostへ配置し、repositoryへ記録しない。
stage-accord.secrets.mail-password-file=/run/secrets/worker/smtp-password
# 用途: session署名用HMAC keyを格納するfile path。
# 状態: production専用path。実値は本番管理者が対象hostへ配置し、repositoryへ記録しない。
stage-accord.secrets.session-hmac-key-file=/run/secrets/application/session-hmac-key
# 用途: CSRF署名用HMAC keyを格納するfile path。
# 状態: production専用path。実値は本番管理者が対象hostへ配置し、repositoryへ記録しない。
stage-accord.secrets.csrf-hmac-key-file=/run/secrets/application/csrf-hmac-key
# 用途: field暗号化keyを格納するfile path。
