# 状態: appロールの設計固定値。RuntimeConfigurationGuardがロールの二重指定を拒否する。
management.server.address=127.0.0.1
# 用途: 管理endpoint専用サーバーの待受ポート。
# 状態: appロールの設計固定値。RuntimeConfigurationGuardがロールの二重指定を拒否する。
management.server.port=8081

