# HTTP response生成までJPAセッションを保持するか。境界外queryを防ぐため無効にする
spring.jpa.open-in-view=false
# Hibernateによるschema操作方針。validateはschema変更せず整合だけを確認する
spring.jpa.hibernate.ddl-auto=validate
# JDBC timestampを読み書きする基準time zone
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# productionでlocalhost等の接続先を拒否するguard
stage-accord.runtime-guard.reject-local-endpoints=true
# productionでtest用資格情報を拒否するguard
stage-accord.runtime-guard.reject-test-credentials=true
