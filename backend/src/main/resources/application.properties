stage-accord.malware-scan.read-timeout=30m
# 許容するmalware定義ファイルの最大経過時間
stage-accord.malware-scan.definition-max-age-hours=24

#---

spring.config.activate.on-profile=app

# =============================================================================
# アプリケーションプロセス — 公開HTTPと内部管理エンドポイントを分離する
# =============================================================================

# 業務HTTPサーバーの待受アドレス。appとworkerで公開範囲が異なる
server.address=0.0.0.0
# 業務HTTPサーバーの待受ポート
server.port=8080
# 管理エンドポイント専用サーバーの待受アドレス
management.server.address=127.0.0.1
# 管理エンドポイント専用サーバーの待受ポート
management.server.port=8081

#---

spring.config.activate.on-profile=worker

# =============================================================================
# ワーカープロセス — 外部へ業務HTTPルートを公開しない
# =============================================================================

# 業務HTTPサーバーの待受アドレス。appとworkerで公開範囲が異なる
server.address=127.0.0.1
# 業務HTTPサーバーの待受ポート
server.port=8081
# worker processで業務HTTP routeを公開するか
stage-accord.worker.inbound-business-routes-enabled=false

#---

spring.config.activate.on-profile=local

# =============================================================================
# 開発環境 — backendを作業ディレクトリとしてローカル秘密ファイルを読み込む
# =============================================================================

# 秘密ファイルをConfiguration Treeとして読み込む場所。プロファイルごとに参照先が異なる
spring.config.import=optional:configtree:secrets/application/,optional:configtree:secrets/worker/
# RuntimeConfigurationGuardが検証する実行環境名。active プロファイルと一致させる
stage-accord.environment=local

# --- 開発用秘密ファイル ---
# 実値はbackend/secrets配下にあり、リポジトリへ記録しない

# PostgreSQL runtime role名を格納するファイルパス
stage-accord.secrets.db-username-file=secrets/application/db-username
# PostgreSQL runtime passwordを格納するファイルパス
stage-accord.secrets.db-password-file=secrets/application/db-password
# Valkey ACL usernameを格納するファイルパス
stage-accord.secrets.valkey-username-file=secrets/application/valkey-username
# Valkey ACL passwordを格納するファイルパス
stage-accord.secrets.valkey-password-file=secrets/application/valkey-password
# application用S3 access key IDを格納するファイルパス
stage-accord.secrets.s3-access-key-id-file=secrets/application/s3-application-access-key-id
# application用S3 secret access keyを格納するファイルパス
stage-accord.secrets.s3-secret-access-key-file=secrets/application/s3-application-secret-access-key
# worker用S3 access key IDを格納するファイルパス
stage-accord.secrets.s3-worker-access-key-id-file=secrets/worker/s3-worker-access-key-id
# worker用S3 secret access keyを格納するファイルパス
stage-accord.secrets.s3-worker-secret-access-key-file=secrets/worker/s3-worker-secret-access-key
# Stripe秘密鍵を格納するファイルパス
stage-accord.secrets.stripe-api-key-file=secrets/application/stripe-api-key
# Stripe webhook署名secretを格納するファイルパス
stage-accord.secrets.stripe-webhook-secret-file=secrets/application/stripe-webhook-secret
# mailプロバイダーの送信資格情報 IDを格納するファイルパス
stage-accord.secrets.mail-username-file=secrets/worker/ses-access-key-id
# mailプロバイダーの送信資格情報 secretを格納するファイルパス
stage-accord.secrets.mail-password-file=secrets/worker/ses-secret-access-key
# セッション署名用HMAC keyを格納するファイルパス
stage-accord.secrets.session-hmac-key-file=secrets/application/session-hmac-key
# CSRF署名用HMAC keyを格納するファイルパス
stage-accord.secrets.csrf-hmac-key-file=secrets/application/csrf-hmac-key
# フィールド暗号化keyを格納するファイルパス
stage-accord.secrets.field-encryption-key-file=secrets/application/field-encryption-key

# --- 開発用データストア ---
# ローカルPostgreSQL・Valkey向けの接続設定

# Spring DataSourceへ渡すPostgreSQL JDBC URL
spring.datasource.url=${stage-accord.database.source-url}
# Spring DataSourceへ渡すPostgreSQL role名
spring.datasource.username=${stage-accord.database.username}
# Spring DataSourceへ渡すPostgreSQL password
spring.datasource.password=${stage-accord.database.password}
# DB transactionを自動commitするか。業務transaction管理のため無効にする
spring.datasource.hikari.auto-commit=false
# DB connection poolから接続を得るまでの上限ミリ秒
spring.datasource.hikari.connection-timeout=5000
# DB connectionの生存確認を待つ上限ミリ秒
spring.datasource.hikari.validation-timeout=3000
# 起動時のDB connection確立に失敗した場合、起動を中止するまでの猶予ミリ秒
spring.datasource.hikari.initialization-fail-timeout=1
# DB connection poolが保持する最大connection数
spring.datasource.hikari.maximum-pool-size=10
# DB connection poolが維持する最小idle connection数
spring.datasource.hikari.minimum-idle=1
# Spring Data Redisへ渡すValkey互換接続URL
spring.data.redis.url=redis://127.0.0.1:6379
# 起動時にFlyway migrationを自動実行するか。権限分離のためruntimeでは無効にする
spring.flyway.enabled=false
# HTTP response生成までJPAセッションを保持するか。境界外queryを防ぐため無効にする
spring.jpa.open-in-view=false
# Hibernateによるschema操作方針。validateはschema変更せず整合だけを確認する
spring.jpa.hibernate.ddl-auto=validate
# JDBC timestampを読み書きする基準time zone
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

#---

spring.config.activate.on-profile=production

# =============================================================================
# 本番環境 — 起動前検査と管理者による外部接続・秘密値の実測確認後だけ使用する
# =============================================================================

# RuntimeConfigurationGuardが検証する実行環境名。active プロファイルと一致させる
stage-accord.environment=production

# --- 本番用秘密ファイル ---
# 実値は本番管理者が/run/secretsへ配置し、リポジトリへ記録しない

# PostgreSQL runtime role名を格納するファイルパス
stage-accord.secrets.db-username-file=/run/secrets/application/db-username
# PostgreSQL runtime passwordを格納するファイルパス
stage-accord.secrets.db-password-file=/run/secrets/application/db-password
# Valkey ACL usernameを格納するファイルパス
stage-accord.secrets.valkey-username-file=/run/secrets/application/valkey-username
# Valkey ACL passwordを格納するファイルパス
stage-accord.secrets.valkey-password-file=/run/secrets/application/valkey-password
# application用S3 access key IDを格納するファイルパス
stage-accord.secrets.s3-access-key-id-file=/run/secrets/application/s3-application-access-key-id
# application用S3 secret access keyを格納するファイルパス
stage-accord.secrets.s3-secret-access-key-file=/run/secrets/application/s3-application-secret-access-key
# worker用S3 access key IDを格納するファイルパス
stage-accord.secrets.s3-worker-access-key-id-file=/run/secrets/worker/s3-worker-access-key-id
# worker用S3 secret access keyを格納するファイルパス
stage-accord.secrets.s3-worker-secret-access-key-file=/run/secrets/worker/s3-worker-secret-access-key
# Stripe秘密鍵を格納するファイルパス
stage-accord.secrets.stripe-api-key-file=/run/secrets/application/stripe-api-key
# Stripe webhook署名secretを格納するファイルパス
stage-accord.secrets.stripe-webhook-secret-file=/run/secrets/application/stripe-webhook-secret
# mailプロバイダーの送信資格情報 IDを格納するファイルパス
stage-accord.secrets.mail-username-file=/run/secrets/worker/smtp-username
# mailプロバイダーの送信資格情報 secretを格納するファイルパス
stage-accord.secrets.mail-password-file=/run/secrets/worker/smtp-password
# セッション署名用HMAC keyを格納するファイルパス
stage-accord.secrets.session-hmac-key-file=/run/secrets/application/session-hmac-key
# CSRF署名用HMAC keyを格納するファイルパス
stage-accord.secrets.csrf-hmac-key-file=/run/secrets/application/csrf-hmac-key
# フィールド暗号化keyを格納するファイルパス
stage-accord.secrets.field-encryption-key-file=/run/secrets/application/field-encryption-key

# --- 本番用データストア ---
# 本番PostgreSQL・Valkey向け。未確定値やローカル接続先は起動時に拒否する

# Spring DataSourceへ渡すPostgreSQL JDBC URL
spring.datasource.url=${stage-accord.database.source-url}
# Spring DataSourceへ渡すPostgreSQL role名
spring.datasource.username=${stage-accord.database.username}
# Spring DataSourceへ渡すPostgreSQL password
spring.datasource.password=${stage-accord.database.password}
# DB transactionを自動commitするか。業務transaction管理のため無効にする
spring.datasource.hikari.auto-commit=false
# DB connection poolから接続を得るまでの上限ミリ秒
spring.datasource.hikari.connection-timeout=5000
# DB connectionの生存確認を待つ上限ミリ秒
spring.datasource.hikari.validation-timeout=3000
# 起動時のDB connection確立に失敗した場合、起動を中止するまでの猶予ミリ秒
spring.datasource.hikari.initialization-fail-timeout=1
# DB connection poolが保持する最大connection数
spring.datasource.hikari.maximum-pool-size=30
# DB connection poolが維持する最小idle connection数
spring.datasource.hikari.minimum-idle=5
# Spring Data Redisへ渡すValkey互換接続URL
spring.data.redis.url=${stage-accord.valkey.url}
# Valkey接続でTLSを必須にする
spring.data.redis.ssl.enabled=true
# Valkey command応答を待つ上限時間
spring.data.redis.timeout=2s
# Valkeyへの接続確立を待つ上限時間
spring.data.redis.connect-timeout=2s
# 起動時にFlyway migrationを自動実行するか。権限分離のためruntimeでは無効にする
spring.flyway.enabled=false
# HTTP response生成までJPAセッションを保持するか。境界外queryを防ぐため無効にする
spring.jpa.open-in-view=false
# Hibernateによるschema操作方針。validateはschema変更せず整合だけを確認する
spring.jpa.hibernate.ddl-auto=validate
# JDBC timestampを読み書きする基準time zone
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- 本番起動ガード ---
# 危険な接続先またはテスト用資格情報があれば起動を中止する

# productionでlocalhost等の接続先を拒否するguard
stage-accord.runtime-guard.reject-local-endpoints=true
# productionでtest用資格情報を拒否するguard
stage-accord.runtime-guard.reject-test-credentials=true
