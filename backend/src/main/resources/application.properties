# Stage AccordのSpring Boot設定はこのファイルだけで管理する
# 秘密値は記載せず、開発環境ではbackend/secrets、本番環境では/run/secretsから読み込む
# 「要確認」「要入力」が残る値は、本番で使用できない

# =============================================================================
# 共通設定
# =============================================================================

# --- Spring Boot基本設定 ---
# アプリケーション識別、プロファイル、秘密ファイル読込み、終了処理

# Spring Bootが識別するアプリケーション名。ログ・メトリクスの識別子にも使う
spring.application.name=stage-accord
# プロファイルが選択されなかった場合の既定プロファイル。誤環境起動を防ぐためnoneに固定する
spring.profiles.default=none
# 秘密ファイルをConfiguration Treeとして読み込む場所。プロファイルごとに参照先が異なる
spring.config.import=optional:configtree:/run/secrets/application/,optional:configtree:/run/secrets/worker/
# JMX管理口の有効・無効。不要な管理面を開かないため無効にする
spring.jmx.enabled=false
# 起動時バナーの表示方法。運用ログのノイズを抑える
spring.main.banner-mode=off
# graceful shutdownで各停止段階を待つ上限時間
spring.lifecycle.timeout-per-shutdown-phase=30s

# --- 監視・ヘルスチェック ---
# 外部公開を必要最小限に制限する

# Actuatorエンドポイントの既定アクセス方針。明示許可していないエンドポイントを閉じる
management.endpoints.access.default=none
# Actuator全体で許可できる最大アクセス水準
management.endpoints.access.max-permitted=read-only
# Actuatorエンドポイントを公開するURLの基点
management.endpoints.web.base-path=/actuator
# HTTP経由で公開を許可するActuatorエンドポイント一覧
management.endpoints.web.exposure.include=health,prometheus
# healthエンドポイントのアクセス水準
management.endpoint.health.access=read-only
# liveness・readiness probe用health groupを有効にする
management.endpoint.health.probes.enabled=true
# health応答へ内部詳細を表示するか。依存情報の露出を防ぐ
management.endpoint.health.show-details=never

# --- HTTP・セッション ---
# プロキシ転送、通信上限、Cookieの安全性を定義する

# reverse proxyから渡されるForwarded系ヘッダーの解釈方式
server.forward-headers-strategy=native
# HTTPリクエストヘッダー全体に許可する最大サイズ
server.max-http-request-header-size=16KB
# HTTPサーバー停止時の接続終了方式
server.shutdown=graceful
# JavaScriptからセッションCookieを読めないようにする
server.servlet.session.cookie.http-only=true
# HTTPS通信時だけセッションCookieを送信する
server.servlet.session.cookie.secure=true
# cross-siteリクエスト時のセッションCookie送信制約
server.servlet.session.cookie.same-site=lax
# セッションCookieの名前。__Host-制約でdomain固定や不正上書きを防ぐ
server.servlet.session.cookie.name=__Host-stageaccord-session
# セッションCookieを送信するURLパス範囲
server.servlet.session.cookie.path=/
# セッション IDを保持する手段。URL埋込みを禁止してCookieだけを使う
server.servlet.session.tracking-modes=cookie

# --- ログ ---
# ログレベル、標準出力形式、機密情報のマスキング

# 標準出力ログの形式と、認証情報らしい値を置換するredaction規則
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%p application=${spring.application.name} logger=%logger{36} correlation_id=%X{correlationId:-none} message=%replace(%m){'(?i)(token|cookie|authorization|password|secret|signature)=[^ ]+','$1=[REDACTED]'}%n
# アプリケーション全体へ適用する既定ログレベル
logging.level.root=info

# --- PostgreSQL ---
# 接続先とGit管理外の実行資格情報

# PostgreSQL接続先URL。資格情報は含めず、username・passwordを別ファイルから読む
stage-accord.database.source-url=jdbc:postgresql://127.0.0.1:5432/deltanotes_dev
# PostgreSQL runtime role名のConfiguration Tree参照
# 秘密値: 開発用は配置済み。本番用は担当管理者が別途発行して配置する
stage-accord.database.username=${db-username:}
# PostgreSQL runtime passwordのConfiguration Tree参照
# 秘密値: 開発用は配置済み。本番用は担当管理者が別途発行して配置する
stage-accord.database.password=${db-password:}

# --- Valkey ---
# セッション、レート制限、キャッシュの接続先

# Valkey接続先URL。空の移植値はlocal実行には使わず、本番では未確定として拒否する
stage-accord.valkey.url=

# --- Amazon S3 ---
# 用途別バケットとアプリケーション・ワーカー別資格情報

# S3 bucketを配置するAWS region
stage-accord.object-storage.region=ap-northeast-1
# S3 APIエンドポイント。productionではregion対応のAmazon公式エンドポイントだけを許可する
stage-accord.object-storage.endpoint=https://deltanotes.s3.ap-northeast-1.amazonaws.com/cloud-sync
# application用S3 access key IDのConfiguration Tree参照
# 秘密値: 開発用は配置済み。本番用は担当管理者が別途発行して配置する
stage-accord.object-storage.application.access-key-id=${s3-application-access-key-id:}
# application用S3 secret access keyのConfiguration Tree参照
# 秘密値: 開発用は配置済み。本番用は担当管理者が別途発行して配置する
stage-accord.object-storage.application.secret-access-key=${s3-application-secret-access-key:}
# upload直後の未検査ファイルを隔離するS3 bucket名
# 要確認: 候補値のため、本番利用前に担当管理者が正式値を確定する
stage-accord.object-storage.quarantine-bucket=deltanotes-quarantine
# malware検査を通過した原本を保持するS3 bucket名
# 要確認: 候補値のため、本番利用前に担当管理者が正式値を確定する
stage-accord.object-storage.clean-bucket=deltanotes-clean
# 生成済みpreviewを保持するS3 bucket名
# 要確認: 候補値のため、本番利用前に担当管理者が正式値を確定する
stage-accord.object-storage.preview-bucket=deltanotes-preview
# 納品・配布対象ファイルを保持するS3 bucket名
# 要確認: 候補値のため、本番利用前に担当管理者が正式値を確定する
stage-accord.object-storage.delivery-bucket=deltanotes-delivery
# worker用S3 access key IDのConfiguration Tree参照
# 秘密値: 開発用は配置済み。本番用はAWS管理者がワーカー専用資格情報を発行する
stage-accord.object-storage.worker.access-key-id=${s3-worker-access-key-id:}
# worker用S3 secret access keyのConfiguration Tree参照
# 秘密値: 開発用は配置済み。本番用はAWS管理者がワーカー専用資格情報を発行する
stage-accord.object-storage.worker.secret-access-key=${s3-worker-secret-access-key:}

# --- Stripe ---
# 本サービスの購読請求だけに使用する

# Stripe秘密鍵のConfiguration Tree参照
# 秘密値: 開発用は配置済み。本番用は担当管理者が別途発行して配置する
stage-accord.billing.stripe.api-key=${stripe-api-key:}
# ブラウザへ公開可能なStripe publishable key。秘密鍵ではない
stage-accord.billing.stripe.publishable-key=pk_live_51TrcxXENZZxPE5HbilwOHdvIDu1paTl6areksbnGV61hL8BhB6to830XYDaeT6QEDua3HJh2aTDrDUclFGWj24u700GuAFNqWY
# Stripe webhook署名検証secretのConfiguration Tree参照
# 秘密値: 開発用は配置済み。本番用は担当管理者が別途発行して配置する
stage-accord.billing.stripe.webhook-secret=${stripe-webhook-secret:}
# Creator Pro月額プランに対応するStripe Price ID
stage-accord.billing.stripe.price.creator-pro-monthly=price_1U0Mm2ENZZxPE5HbRxXaO0Vs
# Creator Pro年額プランに対応するStripe Price ID
stage-accord.billing.stripe.price.creator-pro-yearly=price_1U0Mm1ENZZxPE5HbaHP9gVsa
# Studio月額プランに対応するStripe Price ID
stage-accord.billing.stripe.price.studio-monthly=price_1U0Mm1ENZZxPE5HbKxFSGlX5
# Studio年額プランに対応するStripe Price ID
stage-accord.billing.stripe.price.studio-yearly=price_1U0Mm0ENZZxPE5HbsbWZFVlH

# --- メール ---
# 送信元、確認メール、Amazon SES連携

# メール送信プロバイダーの種類
stage-accord.mail.provider=ses
# 利用者へ表示する送信元メールアドレス
stage-accord.mail.from-address=noreply@deltanotes.ginjiro.homes
# 利用者へ表示する送信者名
stage-accord.mail.from-name=Deltanotes
# 利用者が返信した場合の宛先メールアドレス
stage-accord.mail.reply-to=
# メールアドレス確認を必須にする機能フラグ
stage-accord.mail.require-verification=true
# メール確認linkを組み立てる公開URL
stage-accord.mail.verification-base-url=https://deltanotes.ginjiro.homes
# メール確認トークンの有効秒数
stage-accord.mail.verification-token-ttl-seconds=86400
# password resetトークンの有効秒数
stage-accord.authentication.password-reset-token-ttl-seconds=3600
# Amazon SESを利用するAWS region
stage-accord.mail.ses.region=ap-northeast-1
# SES送信用access key IDのConfiguration Tree参照
# 秘密値: 開発用は配置済み。本番用は担当管理者が別途発行して配置する
stage-accord.mail.ses.access-key-id=${ses-access-key-id:}
# SES送信用secret access keyのConfiguration Tree参照
# 秘密値: 開発用は配置済み。本番用は担当管理者が別途発行して配置する
stage-accord.mail.ses.secret-access-key=${ses-secret-access-key:}

# --- セキュリティ ---
# セッション・CSRF署名、暗号化、ブラウザ接続元

# セッション署名用HMAC keyのConfiguration Tree参照
# 秘密値: 開発用は配置済み。本番用は担当管理者が別途発行して配置する
stage-accord.security.session-hmac-key=${session-hmac-key:}
# CSRFトークン署名用HMAC keyのConfiguration Tree参照
# 秘密値: 開発用は配置済み。本番用は担当管理者が別途発行して配置する
stage-accord.security.csrf-hmac-key=${csrf-hmac-key:}
# browserリクエストを許可するCORS origin一覧
stage-accord.web.allowed-origins=https://deltanotes.ginjiro.homes,http://127.0.0.1:4173,http://localhost:4173
# DB内の保護対象フィールドを暗号化するkeyのConfiguration Tree参照
# 秘密値: 開発用は生成済み。本番用はセキュリティ管理者が独立して生成・保管する
stage-accord.security.field-encryption-key=${field-encryption-key:}

# --- WebAuthn ---
# 本番利用前に正式ドメインとHTTPSオリジンを確定する

# WebAuthn資格情報を結び付けるRelying Party domain
# 要確認: 候補値のため、本番利用前に担当管理者が正式値を確定する
stage-accord.webauthn.rp-id=deltanotes.ginjiro.homes
# WebAuthn登録・認証を許可するHTTPS origin一覧
# 要確認: 候補値のため、本番利用前に担当管理者が正式値を確定する
stage-accord.webauthn.allowed-origins=https://deltanotes.ginjiro.homes

# --- マルウェア検査 ---
# requiredまたは承認済みbypassで運用する

# ファイル malware検査を必須にするか、明示的にbypassするか
# 要確認: 本番でbypassを許可するか、セキュリティ・運用責任者が判断する
stage-accord.malware-scan.mode=bypass
# required modeで接続するClamAVホスト。bypassでは使用しない
# 要入力: requiredへ変更する場合はClamAVの接続先を設定する
stage-accord.malware-scan.host=
# ClamAV clamdのTCPポート
stage-accord.malware-scan.port=3310
# ClamAVへのTCP接続を待つ上限時間
stage-accord.malware-scan.connect-timeout=5s
# 大容量ファイルのClamAV検査結果を待つ上限時間
stage-accord.malware-scan.read-timeout=30m
# 許容するmalware定義ファイルの最大経過時間
stage-accord.malware-scan.definition-max-age-hours=24

