# Stage AccordのSpring Boot設定正本。このfile以外のapplication設定fileを作成しない。
# 各parameterの値は、直前の「用途」と「状態」を確認してから扱う。
# 秘密値は記載せず、Configuration Treeでbackend/secretsまたは/run/secretsから読む。
# 状態に「管理者確認必須」とある値は、実在・権限・外部契約を確認するまで本番利用不可。

# 用途: Spring Bootが識別するアプリケーション名。ログ・メトリクスの識別子にも使う。
# 状態: Stage Accordの共通設計固定値。変更時は起動試験と関連するsecurity境界を再検証する。
spring.application.name=stage-accord
# 用途: profileが選択されなかった場合の既定profile。誤環境起動を防ぐためnoneに固定する。
# 状態: Stage Accordの共通設計固定値。変更時は起動試験と関連するsecurity境界を再検証する。
spring.profiles.default=none
# 用途: 秘密ファイルをConfiguration Treeとして読み込む場所。profileごとに参照先が異なる。
# 状態: Stage Accordの共通設計固定値。変更時は起動試験と関連するsecurity境界を再検証する。
spring.config.import=optional:configtree:/run/secrets/application/,optional:configtree:/run/secrets/worker/
# 用途: JMX管理口の有効・無効。不要な管理面を開かないため無効にする。
# 状態: Stage Accordの共通設計固定値。変更時は起動試験と関連するsecurity境界を再検証する。
spring.jmx.enabled=false
# 用途: 起動時バナーの表示方法。運用ログのノイズを抑える。
# 状態: Stage Accordの共通設計固定値。変更時は起動試験と関連するsecurity境界を再検証する。
spring.main.banner-mode=off
# 用途: graceful shutdownで各停止段階を待つ上限時間。
# 状態: Stage Accordの共通設計固定値。変更時は起動試験と関連するsecurity境界を再検証する。
spring.lifecycle.timeout-per-shutdown-phase=30s
# 用途: Actuator endpointの既定アクセス方針。明示許可していないendpointを閉じる。
# 状態: Stage Accordの共通設計固定値。変更時は起動試験と関連するsecurity境界を再検証する。
management.endpoints.access.default=none
# 用途: Actuator全体で許可できる最大アクセス水準。
# 状態: Stage Accordの共通設計固定値。変更時は起動試験と関連するsecurity境界を再検証する。
management.endpoints.access.max-permitted=read-only
# 用途: Actuator endpointを公開するURLの基点。
# 状態: Stage Accordの共通設計固定値。変更時は起動試験と関連するsecurity境界を再検証する。
management.endpoints.web.base-path=/actuator
# 用途: HTTP経由で公開を許可するActuator endpoint一覧。
# 状態: Stage Accordの共通設計固定値。変更時は起動試験と関連するsecurity境界を再検証する。
management.endpoints.web.exposure.include=health,prometheus
# 用途: health endpointのアクセス水準。
# 状態: Stage Accordの共通設計固定値。変更時は起動試験と関連するsecurity境界を再検証する。
management.endpoint.health.access=read-only
# 用途: liveness・readiness probe用health groupを有効にする。
# 状態: Stage Accordの共通設計固定値。変更時は起動試験と関連するsecurity境界を再検証する。
management.endpoint.health.probes.enabled=true
# 用途: health応答へ内部詳細を表示するか。依存情報の露出を防ぐ。
# 状態: Stage Accordの共通設計固定値。変更時は起動試験と関連するsecurity境界を再検証する。
management.endpoint.health.show-details=never
# 用途: reverse proxyから渡されるForwarded系headerの解釈方式。
# 状態: Stage Accordの共通設計固定値。変更時は起動試験と関連するsecurity境界を再検証する。
server.forward-headers-strategy=native
# 用途: HTTP request header全体に許可する最大サイズ。
# 状態: Stage Accordの共通設計固定値。変更時は起動試験と関連するsecurity境界を再検証する。
server.max-http-request-header-size=16KB
# 用途: HTTP server停止時の接続終了方式。
# 状態: Stage Accordの共通設計固定値。変更時は起動試験と関連するsecurity境界を再検証する。
server.shutdown=graceful
# 用途: JavaScriptからsession cookieを読めないようにする。
# 状態: Stage Accordの共通設計固定値。変更時は起動試験と関連するsecurity境界を再検証する。
server.servlet.session.cookie.http-only=true
# 用途: HTTPS通信時だけsession cookieを送信する。
# 状態: Stage Accordの共通設計固定値。変更時は起動試験と関連するsecurity境界を再検証する。
server.servlet.session.cookie.secure=true
# 用途: cross-site request時のsession cookie送信制約。
# 状態: Stage Accordの共通設計固定値。変更時は起動試験と関連するsecurity境界を再検証する。
server.servlet.session.cookie.same-site=lax
# 用途: session cookieの名前。__Host-制約でdomain固定や不正上書きを防ぐ。
# 状態: Stage Accordの共通設計固定値。変更時は起動試験と関連するsecurity境界を再検証する。
server.servlet.session.cookie.name=__Host-stageaccord-session
# 用途: session cookieを送信するURL path範囲。
# 状態: Stage Accordの共通設計固定値。変更時は起動試験と関連するsecurity境界を再検証する。
server.servlet.session.cookie.path=/
# 用途: session IDを保持する手段。URL埋込みを禁止してcookieだけを使う。
# 状態: Stage Accordの共通設計固定値。変更時は起動試験と関連するsecurity境界を再検証する。
server.servlet.session.tracking-modes=cookie
# 用途: 標準出力ログの形式と、認証情報らしい値を置換するredaction規則。
# 状態: Stage Accordの共通設計固定値。変更時は起動試験と関連するsecurity境界を再検証する。
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%p application=${spring.application.name} logger=%logger{36} correlation_id=%X{correlationId:-none} message=%replace(%m){'(?i)(token|cookie|authorization|password|secret|signature)=[^ ]+','$1=[REDACTED]'}%n
# 用途: 移植元設定が想定していた環境名を記録する互換情報。実行profileの選択には使わない。
# 状態: 移植元から値を変更せず保存。Stage Accordで利用する場合は該当サービス管理者の確認が必要。
stage-accord.migrated.source-environment=production
# 用途: アカウント削除機能を許可する移植元のfeature flag。
# 状態: 移植元から値を変更せず保存。Stage Accordで利用する場合は該当サービス管理者の確認が必要。
stage-accord.privacy.account-deletion-enabled=true
# 用途: MCP連携の有効・無効を記録する互換設定。Production V1では使用しない。
# 状態: 移植元から値を変更せず保存。Production V1では未使用であり、機能を有効化しない。
stage-accord.out-of-scope.mcp.enabled=true
# 用途: MCPが対象とするresource URL。Production V1では使用しない。
# 状態: 移植元から値を変更せず保存。Production V1では未使用であり、機能を有効化しない。
stage-accord.out-of-scope.mcp.resource-url=https://deltanotes.ginjiro.homes/mcp
# 用途: MCP認可issuerのURL。Production V1では使用しない。
# 状態: 移植元から値を変更せず保存。Production V1では未使用であり、機能を有効化しない。
stage-accord.out-of-scope.mcp.issuer-url=https://deltanotes.ginjiro.homes
# 用途: アプリケーション全体へ適用する既定ログレベル。
# 状態: 移植元から値を変更せず保存。Stage Accordで利用する場合は該当サービス管理者の確認が必要。
logging.level.root=info
# 用途: 移植元Web serverの待受hostを記録する互換値。Springの実待受にはserver.addressを使う。
# 状態: 移植元から値を変更せず保存。Stage Accordで利用する場合は該当サービス管理者の確認が必要。
stage-accord.web.host=0.0.0.0
# 用途: 移植元Web serverのportを記録する互換値。Springの実待受にはserver.portを使う。
# 状態: 移植元から値を変更せず保存。Stage Accordで利用する場合は該当サービス管理者の確認が必要。
stage-accord.web.port=4173
# 用途: ブラウザからアクセスする公開アプリケーションURLの移植値。
# 状態: 移植元から値を変更せず保存。Stage Accordで利用する場合は該当サービス管理者の確認が必要。
stage-accord.web.public.app-url=https://deltanotes.ginjiro.homes
# 用途: ブラウザからアクセスする公開API URLの移植値。
# 状態: 移植元から値を変更せず保存。Stage Accordで利用する場合は該当サービス管理者の確認が必要。
stage-accord.web.public.api-url=https://deltanotes.ginjiro.homes/api
# 用途: モバイルクライアントへ公開する環境名。Production V1では使用しない。
# 状態: 移植元から値を変更せず保存。Production V1では未使用であり、機能を有効化しない。
stage-accord.out-of-scope.mobile.public.environment=local
# 用途: モバイルクライアント向けAPI URL。Production V1では使用しない。
# 状態: 移植元から値を変更せず保存。Production V1では未使用であり、機能を有効化しない。
stage-accord.out-of-scope.mobile.public.api-url=https://deltanotes.ginjiro.homes/api
# 用途: AI providerの選択値。Production V1ではAI機能を提供しない。
# 状態: 移植元から値を変更せず保存。Production V1では未使用であり、機能を有効化しない。
stage-accord.out-of-scope.ai.provider=openai
# 用途: OpenAI API秘密鍵のConfiguration Tree参照。Production V1では使用しない。
# 状態: Production V1では未使用。local値は移植元から用途別秘密fileへ移植済み。production値は該当サービス管理者が別途発行・配置する。
stage-accord.out-of-scope.ai.openai.api-key=${openai-api-key:}
# 用途: OpenAI生成model名。Production V1では使用しない。
# 状態: 移植元から値を変更せず保存。Production V1では未使用であり、機能を有効化しない。
stage-accord.out-of-scope.ai.openai.model=gpt-5.6-terra
# 用途: OpenAI embedding model名。Production V1では使用しない。
# 状態: 移植元から値を変更せず保存。Production V1では未使用であり、機能を有効化しない。
stage-accord.out-of-scope.ai.openai.embedding-model=text-embedding-3-large
# 用途: OpenAI互換APIの基点URL。Production V1では使用しない。
# 状態: 移植元から値を変更せず保存。Production V1では未使用であり、機能を有効化しない。
stage-accord.out-of-scope.ai.openai.base-url=
# 用途: Azure OpenAI秘密鍵のConfiguration Tree参照。Production V1では使用しない。
# 状態: Production V1では未使用。local値は移植元から用途別秘密fileへ移植済み。production値は該当サービス管理者が別途発行・配置する。
stage-accord.out-of-scope.ai.azure-openai.api-key=${azure-openai-api-key:}
# 用途: Azure OpenAI resource endpoint。Production V1では使用しない。
# 状態: 移植元から値を変更せず保存。Production V1では未使用であり、機能を有効化しない。
stage-accord.out-of-scope.ai.azure-openai.endpoint=
# 用途: Azure OpenAI API version。Production V1では使用しない。
# 状態: 移植元から値を変更せず保存。Production V1では未使用であり、機能を有効化しない。
stage-accord.out-of-scope.ai.azure-openai.api-version=
# 用途: Azure OpenAI deployment名。Production V1では使用しない。
# 状態: 移植元から値を変更せず保存。Production V1では未使用であり、機能を有効化しない。
stage-accord.out-of-scope.ai.azure-openai.deployment=
# 用途: ローカルLLM endpoint。Production V1では使用しない。
# 状態: 移植元から値を変更せず保存。Production V1では未使用であり、機能を有効化しない。
stage-accord.out-of-scope.ai.local.base-url=http://127.0.0.1:11434
# 用途: ローカルLLM model名。Production V1では使用しない。
# 状態: 移植元から値を変更せず保存。Production V1では未使用であり、機能を有効化しない。
stage-accord.out-of-scope.ai.local.model=
# 用途: 移植元cloud syncの有効・無効。Production V1では使用しない。
# 状態: 移植元から値を変更せず保存。Production V1では未使用であり、機能を有効化しない。
stage-accord.out-of-scope.cloud-sync.enabled=false
# 用途: 移植元cloud sync API URL。Production V1では使用しない。
# 状態: 移植元から値を変更せず保存。Production V1では未使用であり、機能を有効化しない。
stage-accord.out-of-scope.cloud-sync.api-url=https://deltanotes.ginjiro.homes/api
# 用途: 移植元cloud sync tokenのConfiguration Tree参照。Production V1では使用しない。
# 状態: Production V1では未使用。local値は移植元から用途別秘密fileへ移植済み。production値は該当サービス管理者が別途発行・配置する。
stage-accord.out-of-scope.cloud-sync.api-token=${cloud-api-token:}
# 用途: 移植元cloud sync device ID。Production V1では使用しない。
# 状態: 移植元から値を変更せず保存。Production V1では未使用であり、機能を有効化しない。
stage-accord.out-of-scope.cloud-sync.device-id=desktop-main
# 用途: PostgreSQL接続先URL。資格情報は含めず、username・passwordを別ファイルから読む。
# 状態: 移植元から値を変更せず保存。local用途の値であり、production要件を満たすとは限らない。
stage-accord.database.source-url=jdbc:postgresql://127.0.0.1:5432/deltanotes_dev
# 用途: Valkey接続先URL。空の移植値はlocal実行には使わず、本番では未確定として拒否する。
# 状態: 移植元から値を変更せず保存。local用途の値であり、production要件を満たすとは限らない。
stage-accord.valkey.url=
# 用途: 移植元が選択していたobject storage実装。
# 状態: 移植元から値を変更せず保存。Stage Accordで利用する場合は該当サービス管理者の確認が必要。
stage-accord.object-storage.driver=local
# 用途: local filesystem storageを使う場合の保存directory。
# 状態: 移植元から値を変更せず保存。Stage Accordで利用する場合は該当サービス管理者の確認が必要。
stage-accord.object-storage.local-directory=.tmp/deltanotes-blobs
# 用途: 移植元で使われていた単一S3 bucket名。Stage Accordの4用途bucketとは別の記録値。
# 状態: 移植元から値を変更せず保存。Stage Accordで利用する場合は該当サービス管理者の確認が必要。
stage-accord.object-storage.source-bucket=deltanotes
# 用途: S3 bucketを配置するAWS region。
# 状態: 移植元から値を変更せず保存。local用途の値であり、production要件を満たすとは限らない。
stage-accord.object-storage.region=ap-northeast-1
# 用途: S3 API endpoint。productionではregion対応のAmazon公式endpointだけを許可する。
# 状態: 移植元から値を変更せず保存。local用途の値であり、production要件を満たすとは限らない。
stage-accord.object-storage.endpoint=https://deltanotes.s3.ap-northeast-1.amazonaws.com/cloud-sync
# 用途: application用S3 access key IDのConfiguration Tree参照。
# 状態: local値は移植元から用途別秘密fileへ移植済み。production値は該当サービス管理者が別途発行・配置する。
stage-accord.object-storage.application.access-key-id=${s3-application-access-key-id:}
# 用途: application用S3 secret access keyのConfiguration Tree参照。
# 状態: local値は移植元から用途別秘密fileへ移植済み。production値は該当サービス管理者が別途発行・配置する。
stage-accord.object-storage.application.secret-access-key=${s3-application-secret-access-key:}
# 用途: 請求機能全体を有効にするfeature flag。
# 状態: 移植元から値を変更せず保存。Stage Accordで利用する場合は該当サービス管理者の確認が必要。
stage-accord.billing.enabled=true
# 用途: 新規購入操作を許可するfeature flag。
# 状態: 移植元から値を変更せず保存。Stage Accordで利用する場合は該当サービス管理者の確認が必要。
stage-accord.billing.purchases-enabled=false
# 用途: Stripe秘密鍵のConfiguration Tree参照。
# 状態: local値は移植元から用途別秘密fileへ移植済み。production値は該当サービス管理者が別途発行・配置する。
stage-accord.billing.stripe.api-key=${stripe-api-key:}
# 用途: ブラウザへ公開可能なStripe publishable key。秘密鍵ではない。
# 状態: 移植元から値を変更せず保存。Stage Accordで利用する場合は該当サービス管理者の確認が必要。
stage-accord.billing.stripe.publishable-key=pk_live_51TrcxXENZZxPE5HbilwOHdvIDu1paTl6areksbnGV61hL8BhB6to830XYDaeT6QEDua3HJh2aTDrDUclFGWj24u700GuAFNqWY
# 用途: Stripe webhook署名検証secretのConfiguration Tree参照。
# 状態: local値は移植元から用途別秘密fileへ移植済み。production値は該当サービス管理者が別途発行・配置する。
