spring:
  application:
    name: stage-accord
  config:
    import: "optional:configtree:/run/secrets/application/,optional:configtree:/run/secrets/worker/"
  jmx:
    enabled: false
  main:
    banner-mode: "off"
  lifecycle:
    timeout-per-shutdown-phase: 30s

management:
  endpoints:
    access:
      default: none
      max-permitted: read-only
    web:
      base-path: /actuator
      exposure:
        include: health,prometheus
  endpoint:
    health:
      access: read-only
      probes:
        enabled: true
      show-details: never

server:
  forward-headers-strategy: native
  max-http-request-header-size: 16KB
  shutdown: graceful
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: lax
        name: __Host-stageaccord-session
        path: /
      tracking-modes: cookie

logging:
  level:
    root: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%p application=${spring.application.name} logger=%logger{36} correlation_id=%X{correlationId:-none} message=%replace(%m){'(?i)(token|cookie|authorization|password|secret|signature)=[^ ]+','$1=[REDACTED]'}%n"

stage-accord:
  environment: ${APP_ENVIRONMENT}
  object-storage:
    region: ${S3_REGION}
    endpoint: ${S3_ENDPOINT}
    quarantine-bucket: ${S3_QUARANTINE_BUCKET}
    clean-bucket: ${S3_CLEAN_BUCKET}
    preview-bucket: ${S3_PREVIEW_BUCKET}
    delivery-bucket: ${S3_DELIVERY_BUCKET}
  malware-scan:
    mode: ${MALWARE_SCAN_MODE}
    host: ${CLAMAV_HOST:}
    port: ${CLAMAV_PORT:3310}
    connect-timeout: ${CLAMAV_CONNECT_TIMEOUT:5s}
    read-timeout: ${CLAMAV_READ_TIMEOUT:30m}
    definition-max-age-hours: ${CLAMAV_DEFINITION_MAX_AGE_HOURS:24}
  webauthn:
    rp-id: ${WEBAUTHN_RP_ID}
    allowed-origins: ${WEBAUTHN_ALLOWED_ORIGINS}
  secrets:
    db-username-file: ${DB_USERNAME_FILE}
    db-password-file: ${DB_PASSWORD_FILE}
    valkey-username-file: ${VALKEY_USERNAME_FILE}
    valkey-password-file: ${VALKEY_PASSWORD_FILE}
    s3-access-key-id-file: ${S3_ACCESS_KEY_ID_FILE}
    s3-secret-access-key-file: ${S3_SECRET_ACCESS_KEY_FILE}
    s3-worker-access-key-id-file: ${S3_WORKER_ACCESS_KEY_ID_FILE}
    s3-worker-secret-access-key-file: ${S3_WORKER_SECRET_ACCESS_KEY_FILE}
    stripe-api-key-file: ${STRIPE_API_KEY_FILE}
    stripe-webhook-secret-file: ${STRIPE_WEBHOOK_SECRET_FILE}
    mail-username-file: ${MAIL_USERNAME_FILE}
    mail-password-file: ${MAIL_PASSWORD_FILE}
    session-hmac-key-file: ${SESSION_HMAC_KEY_FILE}
    csrf-hmac-key-file: ${CSRF_HMAC_KEY_FILE}
    field-encryption-key-file: ${FIELD_ENCRYPTION_KEY_FILE}
